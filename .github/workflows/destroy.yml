name: CineAndes - Destruir infraestructura

run-name: ${{ github.actor }} destruye CineAndes en dev
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  destruir:
    name: Destruir dev
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Obtener credenciales temporales de AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar con el backend S3
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Seleccionar el workspace development
        run: terraform workspace select development

      - name: Destruir la infraestructura
        run: terraform destroy -auto-approve -var="region=${{ vars.AWS_REGION }}"