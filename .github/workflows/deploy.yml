name: CineAndes - Desplegar infraestructura

run-name: ${{ github.actor }} despliega CineAndes en dev
on:
  push:
    branches: [develop]
    paths:
      - "terraform/**"
      - "lambdas/**"
      - "ansible/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar en dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_correo_ses: ${{ vars.CORREO_SES }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Obtener credenciales temporales de AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Revisar formato
        run: terraform fmt -check -recursive

      - name: Inicializar con el backend S3
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Seleccionar el workspace development
        run: terraform workspace select -or-create development

      - name: Validar la configuración
        run: terraform validate

      - name: Planificar los cambios
        run: terraform plan -var="region=${{ vars.AWS_REGION }}" -out=tfplan

      - name: Aplicar la infraestructura
        run: terraform apply -auto-approve tfplan
        
      - name: Preparar Python para Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Ansible y sus dependencias
        working-directory: .
        run: |
          pip install ansible-core boto3
          ansible-galaxy collection install amazon.aws

      - name: Exportar los nombres de las funciones desde Terraform
        run: |
          terraform output -json funciones_nombre | jq '{funciones: .}' > "$RUNNER_TEMP/funciones.json"

      - name: Desplegar el código de las funciones con Ansible
        working-directory: .
        run: ansible-playbook -i ansible/inventario.ini ansible/desplegar_codigo.yml -e "@$RUNNER_TEMP/funciones.json"

      - name: Verificar las funciones con Ansible
        working-directory: .
        run: ansible-playbook -i ansible/inventario.ini ansible/verificar.yml -e "@$RUNNER_TEMP/funciones.json"